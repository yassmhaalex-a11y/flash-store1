<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLASH STORE</title><style>body{font-family:Arial;margin:0;background:#0b0b0f;color:#fff}header{padding:22px;background:#15151c;display:flex;justify-content:space-between}main{padding:25px;max-width:1100px;margin:auto}.hero{padding:35px;background:linear-gradient(135deg,#250000,#15151c);border-radius:18px}button{background:#e31b23;color:#fff;border:0;border-radius:10px;padding:11px 16px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:20px}.card{background:#171720;border:1px solid #292936;border-radius:15px;padding:16px}.price{font-size:22px;font-weight:700}.muted{color:#aaa}.err{background:#3b1114;padding:12px;border-radius:10px;margin-top:15px}</style></head><body><header><b>⚡ FLASH STORE</b><button onclick="login()">Login</button></header><main><section class="hero"><h1>FLASH STORE</h1><p>Gaming & digital products.</p></section><h2>Categories</h2><div id="cats" class="grid"></div><h2>Products</h2><div id="products" class="grid"></div><div id="msg"></div></main><script>
const $=x=>document.getElementById(x);async function api(p,o){const r=await fetch(p,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{const [c,p]=await Promise.all([api('/api/categories'),api('/api/products')]);$('cats').innerHTML=c.map(x=>`<div class="card"><h3>${x.name}</h3><p class="muted">${x.description||''}</p></div>`).join('');$('products').innerHTML=p.map(x=>`<div class="card"><div style="font-size:35px">${x.emoji||'🎮'}</div><h3>${x.name}</h3><p class="muted">${x.description||''}</p><div class="price">${x.price} EGP</div><button onclick="order('${String(x.name).replace(/'/g,"\\'")}')">Order Now</button></div>`).join('')}catch(e){$('msg').innerHTML=`<div class="err">FLASH API error: ${e.message}</div>`}}
function order(n){location.href='/checkout.html?product='+encodeURIComponent(n)}async function login(){const email=prompt('Email');if(!email)return;const password=prompt('Password');try{const r=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});localStorage.token=r.token;alert('Logged in')}catch(e){alert(e.message)}}load();</script></body></html>
