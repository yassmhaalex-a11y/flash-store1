<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — FLASH STORE</title><link rel="stylesheet" href="/style.css"></head><body><header class="header"><a class="brand" href="/">FLASH STORE</a><nav><a href="/">Store</a><a href="/account.html">Account</a></nav></header><main class="section"><span class="eyebrow">ORDER</span><h1>Checkout</h1><div style="display:grid;grid-template-columns:1.2fr .8fr;gap:25px"><section class="modal-box"><h2>Your Details</h2><div class="field"><label>Full Name</label><input id="fullName"></div><div class="field"><label>Phone Number</label><input id="phone"></div><div class="field"><label>Email</label><input id="email"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="For your store account/order record"></div><div class="field"><label>Payment Method</label><select id="payment"></select><small id="paymentDetails" class="muted"></small></div><div class="field"><label>Payment Proof Image</label><input id="proof" type="file" accept="image/*"><small class="muted">Optional until you complete the transfer.</small></div><div class="field"><label>Discount Code</label><div style="display:flex;gap:8px"><input id="discount"><button class="small-btn" id="apply">Apply</button></div><small id="discountMsg" class="muted"></small></div><button class="btn" id="place" style="width:100%">Place Order</button></section><aside class="modal-box"><h2>Order Summary</h2><div id="items"></div><hr><p>Subtotal: <b id="sub"></b></p><p>Discount: <b id="disc">0 EGP</b></p><h2>Total: <span id="total"></span></h2></aside></div></main><script src="/checkout.js"></script></body></html>
