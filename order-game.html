<!doctype html><html lang="en"><head><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/icon-180.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Game | FLASH STORE</title><link rel="stylesheet" href="/style.css"></head><body><main class="v45-page"><a href="/">← FLASH STORE</a><h1>Request a Game</h1><p>Can't find your game? Send us a request.</p><form id="gameForm"><input name="name" placeholder="Your name" maxlength="100" required><input name="contact" placeholder="WhatsApp or email" maxlength="120" required><input name="game" placeholder="Game title" maxlength="150" required><textarea name="details" placeholder="Edition, platform, or extra details" maxlength="1000"></textarea><button class="btn">Send Request</button><p id="msg"></p></form></main><script>document.getElementById('gameForm').onsubmit=async e=>{e.preventDefault();const f=e.target,m=document.getElementById('msg');m.textContent='Sending...';try{const r=await fetch('/api/game-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();if(!r.ok)throw Error(d.error);m.textContent='Request sent successfully!';f.reset()}catch(err){m.textContent=err.message}}</script></body></html>
